# Esquema original del cliente: detras de Caddy (HTTPS) la cookie de refresco
# debe salir con Secure; en acceso directo por http://IP:3000 se usa $scheme.
map $http_x_forwarded_proto $kubo_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    # Dual-stack: la sonda de salud del contenedor usa 127.0.0.1 y algunos
    # clientes de la red del local llegan por IPv6.
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/kubo-security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # El service worker nunca se cachea: debe poder actualizarse solo.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/kubo-security-headers.conf;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/kubo-security-headers.conf;
        types { application/manifest+json webmanifest; }
    }

    # Activos con hash en el nombre: cache agresivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/kubo-security-headers.conf;
    }

    # La API viaja al gateway: mismo origen, sin CORS y sin exponer los servicios.
    #
    # La resolucion se hace por peticion contra el DNS interno de Docker
    # (`resolver` + variable). Con el nombre literal, nginx resuelve UNA vez al
    # arrancar y guarda la IP: al recrear el gateway (actualizacion, cambio de
    # configuracion), el proxy seguiria apuntando a la IP vieja y devolveria 502
    # hasta reiniciar la web.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway http://kubo-gateway:8080;
        proxy_pass $gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se SOBRESCRIBE la cabecera (no se agrega con $proxy_add_x_forwarded_for):
        # si se agregara, un cliente podria inyectar una IP falsa al frente y
        # saltarse el limite de autenticacion del gateway.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $kubo_proto;
        proxy_read_timeout 30s;
    }

    # SPA: cualquier ruta desconocida devuelve el shell de la aplicacion.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

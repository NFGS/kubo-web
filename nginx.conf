server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # El service worker nunca se cachea: debe poder actualizarse solo.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; }
    }

    # Activos con hash en el nombre: cache agresivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # La API viaja al gateway: mismo origen, sin CORS y sin exponer los servicios.
    location /api/ {
        proxy_pass http://kubo-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # SPA: cualquier ruta desconocida devuelve el shell de la aplicacion.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

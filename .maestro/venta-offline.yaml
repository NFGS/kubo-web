appId: com.nfgs.kubo
---
# Venta sin conexion: la app la guarda en la cola local (P-12) y lo avisa.
# El script apaga wifi y datos antes de este flujo; venimos del final de la
# pagina (carrito): se sube al catalogo para elegir y se baja a cobrar.
- extendedWaitUntil:
    visible: "Sin internet"
    timeout: 30000
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- tapOn: "Arroz 500 g.*"
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- tapOn: "Cobrar.*"
- extendedWaitUntil:
    visible: "Sin internet: la venta quedó en cola.*"
    timeout: 30000
- assertVisible: "1 venta(s) esperando sincronización"

appId: com.nfgs.kubo
---
# Venta sin conexion: la app la guarda en la cola local (P-12) y lo avisa.
# El script corta la red y lo verifica con ping; si el WebView no reflejara el
# cambio en el badge, la venta igual se encola por el fallo de red (el aviso
# cambia segun el camino: sin internet o sin respuesta del servidor).
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- tapOn: "Arroz 500 g.*"
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- tapOn: "Cobrar.*"
- extendedWaitUntil:
    visible: "Sin internet: la venta quedó en cola.*|No hubo respuesta del servidor.*"
    timeout: 90000
- assertVisible: "1 venta(s) esperando sincronización"

appId: com.nfgs.kubo
---
# Venta de POS con conexion (Fase 1 del plan movil, ADR-0031).
# La pantalla del emulador es pequena: el menu lateral esta colapsado (se abre
# con "Abrir menú") y el carrito va despues del catalogo; el tope inferior
# absorbe los deslizamientos extra aunque el catalogo crezca. Continua donde
# termino sesion.yaml: app abierta y sesion activa.
- extendedWaitUntil:
    visible: "Abrir menú"
    timeout: 60000
- tapOn: "Abrir menú"
- extendedWaitUntil:
    visible: "Vender"
    timeout: 15000
- tapOn: "Vender"
- extendedWaitUntil:
    visible: "Toca un producto.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Arroz 500 g.*"
    direction: DOWN
- tapOn: "Arroz 500 g.*"
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- tapOn: "Cobrar.*"
# El tunel publico gratis a veces responde 502 en la primera peticion; la app
# conserva el carrito y muestra el error, asi que se reintenta el cobro.
- extendedWaitUntil:
    visible: "Venta .* registrada|Error 502"
    timeout: 60000
- runFlow:
    when:
      visible: "Error 502"
    commands:
      - tapOn: "Cobrar.*"
      - extendedWaitUntil:
          visible: "Venta .* registrada"
          timeout: 60000

appId: com.nfgs.kubo
---
# Venta de POS con conexion (Fase 1 del plan movil, ADR-0031).
# La pantalla del emulador es pequena: el menu lateral esta colapsado (se abre
# con "Abrir menú") y el carrito queda debajo del catalogo (se navega con
# scroll). Continua donde termino sesion.yaml: app abierta y sesion activa.
- extendedWaitUntil:
    visible: "Abrir menú"
    timeout: 60000
- tapOn: "Abrir menú"
- extendedWaitUntil:
    visible: "Vender"
    timeout: 15000
- tapOn: "Vender"
- extendedWaitUntil:
    visible: "Toca un producto.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Arroz 500 g.*"
    direction: DOWN
- tapOn: "Arroz 500 g.*"
- scrollUntilVisible:
    element:
      text: "Cobrar.*"
    direction: DOWN
- tapOn: "Cobrar.*"
- extendedWaitUntil:
    visible: "Venta .* registrada"
    timeout: 30000

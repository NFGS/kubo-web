appId: com.nfgs.kubo
---
# Al volver la conexion, la cola se vacia sola (evento online -> flush).
# El script enciende wifi y datos antes de este flujo.
- extendedWaitUntil:
    visible: "En línea"
    timeout: 60000
# Lleva la vista al carrito: si la venta siguiera pendiente, su aviso seria
# visible aqui y la asercion de abajo fallaria (no un falso positivo).
- scrollUntilVisible:
    element:
      text: "Cobrar.*"
    direction: DOWN
- extendedWaitUntil:
    notVisible: "esperando sincronización"
    timeout: 60000

appId: com.nfgs.kubo
---
# Al volver la conexion, la cola se vacia sola (evento online -> flush).
# El script enciende wifi y datos antes de este flujo. Se baja al carrito
# para que el aviso de pendientes seria visible si la cola no se vaciara.
- extendedWaitUntil:
    visible: "En línea"
    timeout: 60000
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- swipe:
    direction: UP
- extendedWaitUntil:
    notVisible: ".*esperando sincronización.*"
    timeout: 60000

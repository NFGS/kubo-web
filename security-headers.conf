# Cabeceras de seguridad de la PWA (defensa en profundidad).
#
# nginx NO hereda los add_header del server cuando un location define los
# suyos: por eso este bloque se incluye tanto a nivel de server como dentro de
# cada location que ya agrega Cache-Control.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
